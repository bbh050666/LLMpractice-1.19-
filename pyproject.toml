[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-practice-course"
version = "0.1.0"
description = "A progressive, runnable LLM engineering curriculum"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.30,<2"]
inference = [
  "huggingface-hub>=0.24,<1",
  "transformers>=4.45,<5",
  "torch>=2.2",
  "accelerate>=0.33,<2",
]
train = [
  "llm-practice-course[inference]",
  "datasets>=2.20,<4",
  "peft>=0.12,<1",
  "trl>=0.11,<1",
]

[tool.setuptools]
py-modules = []
